name: Elevat execution adapter

on:
  push:
    branches: ["feat/elevat-execution-adapter"]
  pull_request:
    paths:
      - "packages/experimental/elevat-execution-adapter/**"
      - ".github/workflows/elevat-execution-adapter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/experimental/elevat-execution-adapter test
